spring:
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: ${DB_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:100MB}
      file-size-threshold: ${UPLOAD_FILE_SIZE_THRESHOLD:1MB}
      location: ${UPLOAD_LOCATION:/tmp}
      enabled: ${UPLOAD_ENABLED:true}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/SkillSync_DB?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:supeshalau@gmail.com}
    password: ${SMTP_PASSWORD:heuiezkwclhbdvkd}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8082}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: ${SESSION_COOKIE_HTTP_ONLY:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:strict}
        max-age: ${SESSION_TIMEOUT:1800}

